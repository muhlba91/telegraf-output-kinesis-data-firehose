---
repos:
  - repo: https://github.com/siderolabs/conform
    rev: v0.1.0-alpha.33
    hooks:
      - id: conform
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
        exclude: .eslintrc.json|node_modules/*
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [
            "--allow-missing-credentials"
        ]
      - id: detect-private-key
        exclude: node_modules/*
#      - id: no-commit-to-branch
#        args: [
#            "--branch",
#            "main",
#            "--branch",
#            "next"
#        ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: mise exec -- golangci-lint run -c .golangci.yml
        language: system
        pass_filenames: false
        types: [go]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        types: [shell]
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- markdownlint-cli2
        language: system
        types: [markdown]
        exclude: ^CHANGELOG\.md$
